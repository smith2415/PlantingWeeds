# Work experience, newest first, grouped by organization.
#
# To add key results or responsibilities to a role, delete its
# "placeholder: true" line and add a "points" list in its place, like this:
#
#      placeholder: true        <- delete this line
#      points:                  <- and add these
#        - "A result or responsibility."
#        - "Another one."
#
# The notice at the top of the page disappears once no role is marked.
- organization: "Edelman Smithfield"
  note: "Full-time"
  description: >-
    Edelman Smithfield is Edelman's global boutique for financial
    communications, advising clients on the financial markets and strategic
    situations such as mergers and acquisitions and investor relations.
  roles:
    - role: "Hiring Our Heroes Fellow"
      dates: "2025"
      summary: >-
        A placement through the Hiring Our Heroes Corporate Fellowship, a U.S.
        Chamber of Commerce Foundation program that pairs service members
        preparing to leave the military with civilian employers for
        hands-on work experience.
      points:
        - "Supported projects such as M&A, social impact, crisis response, and counter disinformation with research analysis and messaging product refinement."
        - "Also held a special role where I created a joint US Army-Edelman tabletop exercise event designed to facilitate skill and knowledge exchange between civilian and military practices."

- organization: "US Army"
  note: "Full-time, 2018 to 2025"
  description: >-
    Service as an Army officer, beginning in the infantry and moving into
    Psychological Operations, the Army's specialists in understanding and
    influencing audiences.
  roles:
    - role: "Assistant Operations Officer"
      dates: "2024 to 2025"
      summary: >-
        Helps the operations officer plan, coordinate and track a unit's
        operations, training and schedules.
      points:
        - "Planned and executed various training exercises for PSYOP detachments and Companies to prepare for real world and combat scenarios."
    - role: "Psychological Operations Detachment Commander"
      dates: "2022 to 2024"
      summary: >-
        Leads a Psychological Operations detachment, a small team that
        analyzes audiences and plans, develops and delivers influence
        activities in support of military operations.
      points:
        - "Led 12 soldiers on a decentralized global deployment, dual-hatting as information operations lead for two units; analyzed complex information landscapes, threats, and target audiences to ensure 89 successful missions."
    - role: "Group Assistant Operations Officer"
      dates: "2022"
      summary: >-
        Supports operations planning and coordination at group headquarters,
        the brigade-level command above several battalions.
      points:
        - "Supported command and control of PSYOP missions across the globe."
    - role: "Student, US Army Special Warfare Center and School"
      dates: "2020 to 2022"
      summary: >-
        Specially selected for training at the U.S. Army John F. Kennedy
        Special Warfare Center and School to become a Psychological Operations
        Officer.
    - role: "Infantry Stryker Company Executive Officer"
      dates: "2019 to 2020"
      summary: >-
        Second in command of an infantry company equipped with Stryker armored
        vehicles, responsible for its logistics, maintenance and
        administration.
      points:
        - "Commanded company of 152 personnel and 19 vehicles during Commander’s absence, in charge of unit's logistics, maintenance, and headquarters elements."
    - role: "Infantry Platoon Leader"
      dates: "2018 to 2019"
      summary: >-
        Leads an infantry platoon, responsible for its soldiers' training,
        welfare and performance in the field.
      points:
        - "Commanded over 50 soldiers in defending 2 bases in Afghanistan supporting advisory and combat missions."
