# The SCAME checklist on the About page ({% include scame.html %}).
- letter: "S"
  name: "Source"
  question: "Does the author have a noted bias or conflict of interest?"
- letter: "C"
  name: "Content"
  question: "Do the facts and wording seem too good to be true, emotional, or designed to guide me to a conclusion?"
- letter: "A"
  name: "Audience"
  question: "Does this seem to cater to a specific community or type of person?"
- letter: "M"
  name: "Media"
  question: "Am I only seeing this on certain platforms, used mainly by certain audiences?"
- letter: "E"
  name: "Effect"
  question: "Is there an obvious reaction to it, or are people using it in a certain way?"
