# The laundering chain from the yacht case study in "Planting Weeds" (p. 17).
# Shown on the About page with {% include laundering.html %}.
- name: "Russian propagandist"
  layer: "The origin"
  note: "Invents the story and forges the documents to go with it."
- name: "YouTube “journalist”"
  layer: "Layer 1"
  note: "A new account with one other video and 132 subscribers posts it as breaking journalism, so everyone after it has something to cite."
- name: "The Islander"
  layer: "Layer 2"
  note: "A proxy news site publishes a near-identical article, linking back to the video."
- name: "The Strategic Culture Foundation"
  layer: "Layer 3"
  note: "An online journal the US Treasury sanctioned in 2021 as directed by Russian intelligence links to the Islander article."
- name: "US Congresswoman"
  layer: "Layer 4"
  note: "A trusted key communicator shares it with her followers to argue against aid to Ukraine."
- name: "Supporter"
  layer: "The reader"
  note: "Sees it four steps removed from its author, from a source they trust, with little reason to check."
